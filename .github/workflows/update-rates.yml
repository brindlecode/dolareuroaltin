name: Update Exchange Rates

on:
  schedule:
    - cron: '0 3-17 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch current rates
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python src/scripts/fetch-rates.py

      - name: Commit if changed
        run: |
          git diff --quiet src/data/rates_current.json && exit 0
          git config --local user.email "bot@dolareuroaltin.com"
          git config --local user.name "Kur Bot"
          git add src/data/rates_current.json
          git commit -m "kur: $(date +'%d.%m.%Y %H:%M') güncellendi"
          git push
